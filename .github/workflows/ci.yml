name: SentinelPay CI & Staging Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  postgres-integration-and-regression:
    name: Live PostgreSQL 16 Integration & Backend Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_secure_password_999
          POSTGRES_DB: sentinelpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations on Live PostgreSQL
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinel_secure_password_999@localhost:5432/sentinelpay
        run: |
          alembic upgrade head

      - name: Seed Synthetic Initial Data on Live PostgreSQL
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinel_secure_password_999@localhost:5432/sentinelpay
        run: |
          python -c "import asyncio; from app.db.seed_data import seed_database; asyncio.run(seed_database())"

      - name: Run Live PostgreSQL Concurrency & Advisory Lock Verification
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinel_secure_password_999@localhost:5432/sentinelpay
        run: |
          python scripts/verify_postgresql.py

      - name: Run Complete Backend Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinel_secure_password_999@localhost:5432/sentinelpay
          ENVIRONMENT: staging
          LLM_ALLOW_MOCK_FALLBACK: "true"
        run: |
          pytest -v

      - name: Run AI Benchmark Evaluation Dataset
        working-directory: ./backend
        run: |
          python -m app.evaluation.benchmark

  docker-deployment-verification:
    name: Docker Compose Full Stack Staging Deployment
    runs-on: ubuntu-latest
    needs: postgres-integration-and-regression

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start Complete Docker Compose Stack
        run: |
          docker compose up --build -d

      - name: Wait for Containers and Backend Health Endpoint
        run: |
          echo "Waiting for backend service to become fully healthy..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend is healthy and accepting connections!"
              break
            fi
            echo "Attempt $i: Backend not ready yet, sleeping 3s..."
            sleep 3
          done
          docker compose ps

      - name: Run Alembic Migrations Inside Backend Container
        run: |
          docker compose exec -T backend alembic upgrade head

      - name: Verify Live PostgreSQL Concurrency Inside Container
        run: |
          docker compose exec -T backend python scripts/verify_postgresql.py

      - name: Verify Backend Health API Direct Access
        run: |
          curl -f -v http://localhost:8000/api/v1/health

      - name: Verify Nginx Reverse Proxy to Backend API
        run: |
          curl -f -v http://localhost:5173/api/v1/health

      - name: Verify Frontend Web Application Delivery
        run: |
          curl -f -I http://localhost:5173/

      - name: Test Container Graceful Restart & Resilience
        run: |
          docker compose restart backend
          echo "Waiting for backend to recover after restart..."
          for i in {1..20}; do
            if curl -s -f http://localhost:5173/api/v1/health > /dev/null 2>&1; then
              echo "Backend successfully recovered through Nginx reverse proxy!"
              break
            fi
            sleep 2
          done
          curl -f http://localhost:5173/api/v1/health

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down -v

  frontend-build:
    name: Frontend TypeScript & Production Asset Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: TypeScript Validation and Vite Production Build
        working-directory: ./frontend
        run: |
          npm run build
